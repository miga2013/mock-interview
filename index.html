<script>
/********* 설정(여기만 바꾸세요) *********/

const GPTS_URL = 'https://chatgpt.com/g/g-nUjgVjYQI-daeibmyeonjeob-saenggibugiban-myeonjeob-yesangjilmun-curon-jesimun-myeonjeob?model=gpt-5'; // 베타용 ChatGPTs 링크
/*****************************************/

// 토큰 저장 (?k=)
(function saveTokenFromURL(){
  const u = new URL(location.href);
  const k = u.searchParams.get('k');
  if (k) localStorage.setItem('mm_key', k);
})();

// 요소
const $ = id => document.getElementById(id);
const preview = $('preview');
const timeEl = $('time');
const transcript = $('transcript');
const feedback = $('feedback');
const feedbackBox = $('feedbackBox');
const recordStatus = $('recordStatus');
const saveHelp = $('saveHelp');

const btnRecord = $('btnRecord');
const btnPause = $('btnPause');
const btnStop = $('btnStop');
const btnSave = $('btnSave');

const btnFeedbackAlpha = $('btnFeedbackAlpha');
const btnFeedbackBeta = $('btnFeedbackBeta');

const studentName = $('studentName');
const nickname = $('nickname');
const gender = $('gender');
const university = $('university');
const major = $('major');
const questionPreset = $('questionPreset');
const questionCustom = $('questionCustom');
const btnClearTranscript = $('btnClearTranscript');

// 상태
let stream = null;
let mediaRecorder = null;
let chunks = [];
let recordedBlob = null;
let recordedMimeType = '';
let isRecording = false;
let timerId = null;
let startMs = 0;
let elapsedBeforePause = 0;

let recognition = null;
let speechSupported = false;
let finalText = "";

// ------------------------------------------------------------
// 공통 유틸리티
// ------------------------------------------------------------

function fmt(sec){
  const m = String(Math.floor(sec / 60)).padStart(2,'0');
  const s = String(sec % 60).padStart(2,'0');
  return `${m}:${s}`;
}

function startTimer(){
  const base = elapsedBeforePause;
  startMs = Date.now();

  clearInterval(timerId);
  timerId = setInterval(() => {
    const sec = base + Math.floor((Date.now() - startMs) / 1000);
    timeEl.textContent = fmt(sec);
  }, 300);
}

function stopTimer(){
  clearInterval(timerId);
  timerId = null;
}

function resetTimer(){
  stopTimer();
  elapsedBeforePause = 0;
  timeEl.textContent = '00:00';
}

function updateElapsedBeforePause(){
  elapsedBeforePause += Math.floor((Date.now() - startMs) / 1000);
}

function safeFileName(name){
  return String(name || 'student')
    .replace(/[\\/:*?"<>|]/g, '_')
    .replace(/\s+/g, '_')
    .slice(0, 80);
}

// 현재 브라우저가 실제로 녹화할 수 있는 MIME 타입을 검사합니다.
// iPad/Safari에서는 MP4를 우선 시도하고, WebM을 차선으로 사용합니다.
function getSupportedMimeType(){
  if (!window.MediaRecorder) return '';

  const candidates = [
    // Safari/iPad 최신 버전
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    'video/mp4;codecs="avc1.4D401E,mp4a.40.2"',
    'video/mp4',

    // Chrome/Edge 및 최신 Safari
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];

  for (const type of candidates){
    try {
      if (MediaRecorder.isTypeSupported(type)) {
        return type;
      }
    } catch(e){}
  }

  return '';
}

function getExtension(mimeType){
  return String(mimeType).toLowerCase().includes('mp4') ? 'mp4' : 'webm';
}

function isIOSorIPad(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function setStatus(message){
  recordStatus.textContent = message;
}

// ------------------------------------------------------------
// 음성 인식
// ------------------------------------------------------------

(function initSR(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;

  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = e => {
    let interim = '';

    for (let i = e.resultIndex; i < e.results.length; i++){
      const tr = e.results[i][0].transcript;

      if (e.results[i].isFinal) {
        finalText += tr + ' ';
      } else {
        interim += tr;
      }
    }

    transcript.value = (finalText + interim).trim();
  };

  recognition.onerror = e => {
    // 음성인식이 잠깐 끊겨도 영상 녹화는 계속합니다.
    console.log('SpeechRecognition error:', e.error);
  };

  recognition.onend = () => {
    if (isRecording) {
      // Safari/Chrome에서 음성인식 세션이 끝나는 경우 재시작
      setTimeout(() => {
        if (isRecording && recognition) {
          try { recognition.start(); } catch(e){}
        }
      }, 150);
    }
  };

  speechSupported = true;
})();

// ------------------------------------------------------------
// 녹화 시작
// ------------------------------------------------------------

async function startRec(){
  if (isRecording) return;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('이 브라우저에서는 카메라/마이크 기능을 사용할 수 없습니다. HTTPS 주소의 Safari 또는 Chrome을 사용해 주세요.');
    }

    if (!window.MediaRecorder) {
      throw new Error('이 브라우저에서는 영상 녹화를 지원하지 않습니다.');
    }

    const mime = getSupportedMimeType();

    if (!mime) {
      throw new Error('이 기기/브라우저에서 사용할 수 있는 영상 녹화 형식을 찾지 못했습니다. Safari 또는 Chrome을 최신 버전으로 업데이트해 주세요.');
    }

    finalText = "";
    transcript.value = "";
    chunks = [];
    recordedBlob = null;
    recordedMimeType = '';

    btnSave.disabled = true;
    setStatus(`녹화 준비 중 (${getExtension(mime).toUpperCase()})...`);

    stream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: {
        facingMode: 'user'
      }
    });

    preview.srcObject = stream;

    // 실제 생성된 MIME 타입은 mediaRecorder.mimeType에서 다시 확인합니다.
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: mime
    });

    chunks = [];

    mediaRecorder.onstart = () => {
      setStatus(`녹화 중 · ${getExtension(mediaRecorder.mimeType || mime).toUpperCase()}`);
    };

    mediaRecorder.ondataavailable = e => {
      if (e.data && e.data.size > 0) {
        chunks.push(e.data);
      }
    };

    mediaRecorder.onerror = e => {
      console.error('MediaRecorder error:', e);
      setStatus('녹화 중 오류가 발생했습니다.');
    };

    mediaRecorder.onstop = () => {
      // stop() 직후가 아니라 마지막 dataavailable까지 받은 다음 실행됩니다.
      recordedMimeType = mediaRecorder.mimeType || mime;

      if (chunks.length > 0) {
        recordedBlob = new Blob(chunks, {
          type: recordedMimeType
        });

        btnSave.disabled = recordedBlob.size === 0;

        if (recordedBlob.size > 0) {
          const mb = (recordedBlob.size / (1024 * 1024)).toFixed(1);
          setStatus(`녹화 완료 · ${getExtension(recordedMimeType).toUpperCase()} · ${mb} MB`);

          if (isIOSorIPad()) {
            saveHelp.textContent = 'iPad에서는 저장 버튼을 누른 뒤 공유 화면에서 「파일에 저장」을 선택하세요.';
          } else {
            saveHelp.textContent = '저장 버튼을 누르면 녹화 파일이 다운로드됩니다.';
          }
        } else {
          setStatus('녹화 데이터가 비어 있습니다. 다시 녹화해 주세요.');
        }
      } else {
        recordedBlob = null;
        btnSave.disabled = true;
        setStatus('녹화 데이터가 생성되지 않았습니다. 다시 녹화해 주세요.');
      }
    };

    // 1초 단위로 데이터를 받습니다.
    // 마지막 조각은 stop 이벤트 전에 dataavailable로 전달됩니다.
    mediaRecorder.start(1000);

    isRecording = true;
    elapsedBeforePause = 0;

    btnRecord.disabled = true;
    btnPause.disabled = false;
    btnStop.disabled = false;
    btnSave.disabled = true;
    btnPause.textContent = '일시정지';

    startTimer();

    if (speechSupported && recognition) {
      try { recognition.start(); } catch(e){}
    }

  } catch (e) {
    console.error(e);

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }

    isRecording = false;
    btnRecord.disabled = false;
    btnPause.disabled = true;
    btnStop.disabled = true;
    btnSave.disabled = true;

    setStatus('녹화 시작 실패');
    alert('카메라/마이크/녹화 시작에 실패했습니다.\n\n' + (e.message || e));
  }
}

// ------------------------------------------------------------
// 일시정지 / 재개
// ------------------------------------------------------------

function pauseRec(){
  if (!mediaRecorder) return;

  if (mediaRecorder.state === 'recording'){
    try {
      mediaRecorder.pause();
      updateElapsedBeforePause();
      stopTimer();

      if (speechSupported && recognition) {
        try { recognition.stop(); } catch(e){}
      }

      btnPause.textContent = '재개';
      setStatus('일시정지 중');
    } catch(e) {
      console.error(e);
    }

  } else if (mediaRecorder.state === 'paused'){
    try {
      mediaRecorder.resume();

      if (speechSupported && recognition) {
        try { recognition.start(); } catch(e){}
      }

      btnPause.textContent = '일시정지';
      setStatus(`녹화 중 · ${getExtension(mediaRecorder.mimeType).toUpperCase()}`);
      startTimer();
    } catch(e) {
      console.error(e);
    }
  }
}

// ------------------------------------------------------------
// 녹화 종료
// ------------------------------------------------------------

function stopRec(){
  if (!mediaRecorder) return;

  if (mediaRecorder.state === 'inactive') return;

  isRecording = false;
  stopTimer();

  if (speechSupported && recognition) {
    try { recognition.stop(); } catch(e){}
  }

  // 중요:
  // 여기서 stream을 즉시 끊지 않습니다.
  // MediaRecorder가 마지막 dataavailable을 처리한 뒤 onstop에서 정리합니다.
  try {
    mediaRecorder.stop();
  } catch(e) {
    console.error(e);
  }

  btnRecord.disabled = false;
  btnPause.disabled = true;
  btnStop.disabled = true;
  btnPause.textContent = '일시정지';
  btnSave.disabled = true;

  setStatus('녹화 파일을 정리하는 중...');

  // 실제 stream 종료는 약간 뒤에 처리합니다.
  setTimeout(() => {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }, 100);
}

// ------------------------------------------------------------
// 저장
// ------------------------------------------------------------

async function saveBlob(){
  if (!recordedBlob || recordedBlob.size === 0) {
    alert('저장할 녹화가 없습니다. 먼저 녹화를 종료해 주세요.');
    return;
  }

  const mimeType = recordedMimeType || recordedBlob.type || 'video/webm';
  const ext = getExtension(mimeType);

  const timestamp = new Date()
    .toISOString()
    .slice(0,19)
    .replace(/[:T]/g,'-');

  const safeName = safeFileName(studentName.value || 'student');
  const fileName = `${timestamp}_${safeName}.${ext}`;

  // iPad/iPhone Safari:
  // 파일 공유가 가능하면 iOS 공유 시트를 띄워
  // 사용자가 '파일에 저장'을 선택하도록 합니다.
  if (isIOSorIPad() && navigator.share && navigator.canShare && typeof File !== 'undefined') {
    try {
      const file = new File([recordedBlob], fileName, {
        type: mimeType
      });

      if (navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: '모의면접 녹화 영상',
          text: fileName
        });

        setStatus('저장/공유 화면을 열었습니다.');
        return;
      }
    } catch (e) {
      // 사용자가 공유 화면을 취소한 경우도 있으므로
      // 바로 오류로 처리하지 않고 아래의 다운로드 방식으로 한 번 더 시도합니다.
      console.log('iOS share cancelled/unavailable:', e);
    }
  }

  // PC Chrome / Edge / Firefox 및 일부 Safari 환경
  const url = URL.createObjectURL(recordedBlob);
  const a = document.createElement('a');

  a.href = url;
  a.download = fileName;
  a.style.display = 'none';

  document.body.appendChild(a);
  a.click();
  a.remove();

  // Safari에서 너무 빨리 revoke하지 않도록 충분히 기다립니다.
  setTimeout(() => URL.revokeObjectURL(url), 10000);

  setStatus(`저장 요청 완료 · ${fileName}`);

  // iPad에서 Share API를 사용할 수 없는 구형 환경의 fallback
  if (isIOSorIPad()) {
    setTimeout(() => {
      alert('파일 저장 창이 바로 나타나지 않으면, 열린 영상 화면에서 공유 버튼을 눌러 「파일에 저장」을 선택해 주세요.');
    }, 300);
  }
}

function currentQuestion(){
  const custom = questionCustom.value.trim();
  return custom ? custom : (questionPreset.value || '미지정');
}

    question: currentQuestion(),

  if (!payload.transcript) return alert('답변이 비어 있습니다.');

  feedbackBox.classList.remove('hidden');
  feedback.textContent = '피드백 생성 중…';

  try {
    const key = localStorage.getItem('mm_key') || '';

    const res = await fetch(ENDPOINT, {
      method:'POST',
      headers: {
        'Content-Type':'application/json',
        'Authorization': 'Bearer ' + key
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const msg = await res.text().catch(()=>'');
      throw new Error(`서버 응답 오류 (${res.status}): ${msg}`);
    }

    const data = await res.json();
    feedback.textContent = (data.feedback || '피드백을 불러올 수 없습니다.').trim();

  } catch (e) {
    feedback.textContent = '오류: ' + e.message;
  }
};

// ------------------------------------------------------------
// 베타: ChatGPTs 새 창 열기 + 클립보드 자동 복사
// ------------------------------------------------------------

btnFeedbackBeta.onclick = async () => {
  const majorVal = major.value || '미지정';
  const q = currentQuestion();
  const tr = transcript.value.trim();
  const sn = studentName.value || '';
  const nn = nickname.value || '';
  const gd = gender.value || '';

  if (!tr) return alert('학생 답변이 비어 있습니다.');

  const prompt = [
    '역할: 우리반 학생의 대학 모의면접 평가관.',
    '목표: 강점 3~5개, 개선점 3~5개, 예상추가문항 3문항, 1분 모범 답변 예시.',
    `전공: ${majorVal}`,
    `질문: ${q}`,
    `학생(선택): ${sn}${nn ? ' ('+nn+')' : ''} ${gd}`,
    '학생 답변:',
    tr
  ].join('\n\n');

  try {
    await navigator.clipboard.writeText(prompt);
    alert('학생 답변과 지시문을 클립보드에 복사했습니다. 열리는 ChatGPT 창에 붙여넣으세요!');
  } catch (e) {
    alert('클립보드 복사에 실패했습니다. 페이지 권한을 확인하세요.');
  }

  window.open(GPTS_URL, '_blank', 'noopener,noreferrer');
};

// ------------------------------------------------------------
// 버튼 연결
// ------------------------------------------------------------

btnRecord.onclick = startRec;
btnPause.onclick = pauseRec;
btnStop.onclick = stopRec;
btnSave.onclick = saveBlob;

btnClearTranscript.onclick = () => {
  if (confirm('실시간 받아쓰기 내용을 모두 삭제하시겠습니까?')) {
    finalText = "";
    transcript.value = '';
  }
};
